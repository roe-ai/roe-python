[project]
name = "roe-python"
version = "0.1.0"
description = "Python SDK for the Roe AI API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.11.7",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "roe"

[dependency-groups]
dev = [
    "ruff>=0.12.10",
]
