[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roe-ai"
version = "0.0.1"
authors = [
  { name="roe-ai", email="roe.ai.root@gmail.com" },
]
description = "An AI Agent toolkit"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/roe-ai/roe-python"
"Bug Tracker" = "https://github.com/roe-ai/roe-python/issues"